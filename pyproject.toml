[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roadtel"
version = "0.1.0"
description = "LoRa telemetry for frost and ice risk on high-altitude roads: packet format, link-budget model, simulator, ingestion pipeline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
report = ["matplotlib>=3.5", "numpy>=1.21"]
serial = ["pyserial>=3.5"]
dev = ["pytest>=7"]

[project.scripts]
roadtel = "roadtel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
